<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundeportal – forhåndsvisning</title><style>:root{font-family:system-ui,Arial;color-scheme:dark}body{margin:0;background:#07151c;color:#eef4f6}header{border-bottom:1px solid #30434d;padding:20px max(24px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between}main{max-width:1000px;margin:35px auto;padding:0 22px}h1{font-size:30px}h2{font-size:21px;margin:0 0 14px}.muted{color:#adc0c9}.panel{background:#122a35;border:1px solid #35515e;border-radius:12px;padding:22px;margin:20px 0}.item{border-top:1px solid #344b56;padding:15px 0}.item:first-of-type{border-top:0}a{color:#ff8089}select{background:#0d222d;border:1px solid #708d9a;border-radius:6px;padding:12px;color:white;font:inherit;max-width:100%;width:460px}.demo{background:#623b10;color:#ffe0a1;padding:12px 22px;text-align:center}.pill{font-size:12px;padding:4px 8px;border:1px solid #6c8b98;border-radius:12px;margin-left:8px}#error{color:#ff9da3}</style></head><body><div class="demo">ADMIN-FORHÅNDSVISNING – Ekte data. Utkast vises kun her, ikke til kunden.</div><header><strong>PAULSEN BYGGANALYSE · MIN SIDE</strong><a href="/">Tilbake til portalen</a></header><main><label for="customer">Velg kunde</label><p><select id="customer"><option value="">Laster kunder …</option></select></p><p id="error" role="alert"></p><h1>Velkommen, <span id="name">velg kunde</span></h1><p class="muted">Oversikt over kundens eiendommer, oppdrag og rapporter.</p><section class="panel"><h2>Mine tilbud og oppdrag</h2><div id="quotes"></div></section><section class="panel"><h2>Eiendommer og rapporter</h2><div id="properties"></div></section><p><a href="/tilbud">Be om nytt tilbud</a></p></main><script>
const $=id=>document.getElementById(id);
const api=async path=>{const r=await fetch(path,{credentials:'same-origin'});if(r.status===401){location.replace('/');throw Error('Logg inn først')}if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'Kunne ikke hente data');return r.json()};
const item=(parent,title,detail)=>{const el=document.createElement('div');el.className='item';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.className='muted';p.textContent=detail;el.append(h,p);parent.append(el);return el};
async function showCustomer(id){$('error').textContent='';$('quotes').replaceChildren();$('properties').replaceChildren();if(!id){$('name').textContent='velg kunde';return}try{const d=await api('/api/admin/customer-preview?customer_id='+encodeURIComponent(id));if($('customer').value!==id)return;$('name').textContent=d.customer.name;if(!d.quotes.length)$('quotes').textContent='Ingen tilbud knyttet til denne kunden.';for(const q of d.quotes){const status={new:'Mottatt',priced:'Under behandling',sent:'Tilbud sendt',accepted:'Akseptert',declined:'Avslått'}[q.status]||q.status;const el=item($('quotes'),q.property_address,status+' · '+(Array.isArray(q.services)?q.services.join(', '):''));if(q.status==='sent'){const a=document.createElement('a');a.href='/tilbud/svar?token='+encodeURIComponent(q.public_token);a.textContent='Se tilbud';el.append(a)}}const grouped=new Map();for(const p of d.properties){if(!grouped.has(p.id))grouped.set(p.id,{name:p.name,address:p.address,reports:[]});if(p.report_id)grouped.get(p.id).reports.push(p)}if(!grouped.size)$('properties').textContent='Ingen eiendommer registrert.';for(const p of grouped.values()){const el=item($('properties'),p.name,p.address||'');if(!p.reports.length){const x=document.createElement('p');x.className='muted';x.textContent='Ingen rapporter ennå.';el.append(x)}for(const r of p.reports){const line=document.createElement('p');line.textContent=r.report_title+' ';const badge=document.createElement('span');badge.className='pill';badge.textContent=r.report_status==='published'?'Publisert':'Intern: '+r.report_status;line.append(badge);const link=document.createElement('a');link.href='/report-preview?id='+encodeURIComponent(r.report_id);link.target='_blank';link.rel='noopener';link.textContent='Åpne rapport';link.style.marginLeft='12px';line.append(link);el.append(line)}}}catch(e){$('error').textContent=e.message}}
async function init(){const customers=await api('/api/customers');$('customer').replaceChildren();const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Velg en eksisterende kunde';$('customer').append(placeholder);for(const c of customers){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;$('customer').append(o)}$('customer').addEventListener('change',e=>showCustomer(e.target.value));if(customers.length){$('customer').value=customers[0].id;await showCustomer(customers[0].id)}}init().catch(e=>$('error').textContent=e.message);
</script></body></html>
