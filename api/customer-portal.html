<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Min side | Paulsen Bygganalyse</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07151c;color:#f0f5f7;line-height:1.5}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}header{border-bottom:1px solid #29414e;background:#0b202b}header .inner{max-width:1160px;margin:auto;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:15px}.brand img{width:155px;max-height:62px;object-fit:contain;filter:brightness(0) invert(1)}.brand span{font-size:13px;color:#9db4bf;letter-spacing:.08em;text-transform:uppercase;border-left:1px solid #36505d;padding-left:15px}button,.cta{border:0;border-radius:8px;background:#c83b4c;color:white;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;display:inline-block}.cta:hover,button:hover{background:#e04b5b;text-decoration:none}.outline{background:transparent;border:1px solid #56707e}.outline:hover{background:#1a3542}main{max-width:1160px;margin:0 auto;padding:38px 24px 80px}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}.eyebrow{color:#e68c98;text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.12em}h1{font-size:clamp(28px,4vw,39px);margin:4px 0 6px;letter-spacing:-.035em}h2{font-size:23px;margin:0 0 18px;letter-spacing:-.02em}.muted{color:#a9c0cb}.section{margin-top:42px}.properties{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}.property{overflow:hidden;border:1px solid #31505e;border-radius:14px;background:#112934;transition:transform .15s,border-color .15s}.property:hover{transform:translateY(-2px);border-color:#68828d}.cover{height:185px;background:linear-gradient(130deg,#254c5d,#102833 70%);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover .placeholder{color:#94b6c5;font-size:14px;letter-spacing:.12em;text-transform:uppercase}.count{position:absolute;right:13px;bottom:13px;background:#091c25df;border:1px solid #45616e;padding:5px 10px;border-radius:50px;font-size:12px}.property-body{padding:20px}.property-body h3{margin:0 0 4px;font-size:20px}.property-body .address{color:#a9c0cb;margin:0 0 18px}.report{display:block;padding:12px 0;border-top:1px solid #314c59}.report strong{display:block;font-size:14px}.report small{color:#a9c0cb}.report:hover strong{color:#f38c98}.empty{border:1px dashed #42606d;border-radius:12px;padding:24px;color:#a9c0cb}.quotes{display:grid;gap:12px}.quote{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid #304c59;background:#102630;padding:18px 20px;border-radius:11px}.quote strong{display:block}.quote p{margin:4px 0 0;font-size:13px}.status{font-size:12px;color:#c5d8df;border:1px solid #45606d;border-radius:40px;padding:5px 10px;white-space:nowrap}.quote a{color:#ff9aa5;font-weight:650}#error{color:#ff9aa5}@media(max-width:680px){header .inner{padding:12px 16px}.brand img{width:120px}.brand span{font-size:11px}.intro,.quote{align-items:flex-start;flex-direction:column}.properties{grid-template-columns:1fr}main{padding:25px 16px 60px}}
</style></head><body><header><div class="inner"><a class="brand" href="/kunde" aria-label="Paulsen Bygganalyse – Min side"><img src="https://raw.githubusercontent.com/GrevGrisk/paulsenbygganalyse/feature/rapportportal-railway/assets/paulsen-logo-original.png" alt="Paulsen Bygganalyse"><span>Min side</span></a><button id="logout" class="outline">Logg ut</button></div></header><main><div class="intro"><div><div class="eyebrow">Din kundeportal</div><h1>Velkommen, <span id="name">kunde</span></h1><p class="muted">Eiendommene dine, rapportene dine og oversikt over oppdrag.</p></div><a class="cta" href="/tilbud">+ Forespør tilbud</a></div><p id="error" role="alert"></p><section class="section"><h2>Mine eiendommer og rapporter</h2><div id="properties" class="properties"><p class="muted">Laster eiendommer …</p></div></section><section class="section"><h2>Tilbud og oppdrag</h2><div id="quotes" class="quotes"><p class="muted">Laster tilbud …</p></div></section></main><script>
const $=id=>document.getElementById(id);
const api=async path=>{const r=await fetch(path,{credentials:'same-origin'});if(r.status===401){location.replace('/?next=kunde');throw Error('Ikke innlogget')}if(!r.ok)throw Error('Kunne ikke hente data');return r.json()};
const node=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
async function load(){const me=await api('/api/me');if(me.role!=='customer'){location.replace('/');return}$('name').textContent=me.full_name;const [properties,quotes]=await Promise.all([api('/api/properties'),api('/api/customer/quotes')]);const reportsByProperty=await Promise.all(properties.map(p=>api('/api/reports?property_id='+encodeURIComponent(p.id))));$('properties').replaceChildren();if(!properties.length)$('properties').append(node('div','empty','Ingen eiendommer er knyttet til kontoen ennå.'));for(let i=0;i<properties.length;i++){const p=properties[i],reports=reportsByProperty[i],card=node('article','property'),cover=node('div','cover'),photo=reports.find(r=>r.cover)?.cover;if(photo&&(/^(https:\/\/|\/)/i.test(photo))){const img=node('img');img.src=photo;img.alt='Forsidebilde for '+p.name;img.loading='lazy';img.onerror=()=>{img.remove();cover.prepend(node('span','placeholder','Paulsen Bygganalyse'))};cover.append(img)}else cover.append(node('span','placeholder','Paulsen Bygganalyse'));cover.append(node('span','count',reports.length+' '+(reports.length===1?'rapport':'rapporter')));card.append(cover);const body=node('div','property-body');body.append(node('h3','',p.name),node('p','address',p.address));if(!reports.length)body.append(node('p','muted','Ingen publiserte rapporter ennå.'));for(const r of reports){const a=node('a','report');a.href='/kunde/rapport?id='+encodeURIComponent(r.id);a.append(node('strong','',(r.report_code||'Rapport')+' · '+r.title),node('small','','Les rapport og lagre som PDF →'));body.append(a)}card.append(body);$('properties').append(card)}$('quotes').replaceChildren();if(!quotes.length)$('quotes').append(node('div','empty','Ingen tilbud eller oppdrag ennå.'));for(const q of quotes){const state={new:'Tilbud mottatt',priced:'Under behandling',sent:'Tilbud klart',accepted:'Akseptert',declined:'Avsluttet'}[q.status]||q.status;const row=node('article','quote'),info=node('div');info.append(node('strong','',q.property_address),node('p','muted',(q.services||[]).join(', ')));row.append(info);row.append(node('span','status',state));if(q.status==='sent'){const a=node('a');a.href='/tilbud/svar?token='+encodeURIComponent(q.public_token);a.textContent='Se og svar på tilbud →';row.append(a)}$('quotes').append(row)}}
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});location.replace('/')};load().catch(e=>$('error').textContent=e.message);
</script></body></html>
