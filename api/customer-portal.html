<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Min side – Paulsen Bygganalyse</title><style>:root{font-family:system-ui,Arial;color-scheme:dark}body{margin:0;background:#07151c;color:#eef4f6}header{border-bottom:1px solid #30434d;padding:20px max(24px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between}main{max-width:1000px;margin:35px auto;padding:0 22px}h1{font-size:30px}h2{font-size:21px;margin:0 0 14px}.muted{color:#adc0c9}.panel{background:#122a35;border:1px solid #35515e;border-radius:12px;padding:22px;margin:20px 0}.item{border-top:1px solid #344b56;padding:15px 0}.item:first-of-type{border-top:0}a{color:#ff8089}button{background:#dc3449;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid white}#error{color:#ff9da3}small{color:#aec0c9}</style></head><body><header><strong>PAULSEN BYGGANALYSE · MIN SIDE</strong><button id="logout">Logg ut</button></header><main><h1>Velkommen, <span id="name">kunde</span></h1><p class="muted">Oversikt over dine eiendommer, oppdrag og publiserte rapporter.</p><p id="error" role="alert"></p><section class="panel"><h2>Mine tilbud og oppdrag</h2><div id="quotes"><p class="muted">Laster …</p></div></section><section class="panel"><h2>Eiendommer og rapporter</h2><div id="properties"><p class="muted">Laster …</p></div></section><p><a href="/tilbud">Be om nytt tilbud</a></p></main><script>
const $=id=>document.getElementById(id);
const api=async path=>{const r=await fetch(path,{credentials:'same-origin'});if(r.status===401){location.replace('/?next=kunde');throw Error('Ikke innlogget')}if(!r.ok)throw Error('Kunne ikke hente data');return r.json()};
const line=(parent,title,detail)=>{const el=document.createElement('div');el.className='item';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.className='muted';p.textContent=detail;el.append(h,p);parent.append(el);return el};
async function load(){const me=await api('/api/me');if(me.role!=='customer'){location.replace('/');return}$('name').textContent=me.full_name;const [properties,quotes]=await Promise.all([api('/api/properties'),api('/api/customer/quotes')]);$('quotes').replaceChildren();if(!quotes.length)$('quotes').textContent='Ingen tilbud eller oppdrag ennå.';for(const q of quotes){const state={new:'Mottatt',priced:'Under behandling',sent:'Tilbud sendt',accepted:'Akseptert',declined:'Avslått'}[q.status]||q.status;const row=line($('quotes'),q.property_address,state+' · '+q.services.join(', '));if(q.status==='sent'){const a=document.createElement('a');a.href='/tilbud/svar?token='+encodeURIComponent(q.public_token);a.textContent='Se og svar på tilbud';row.append(a)}}$('properties').replaceChildren();if(!properties.length)$('properties').textContent='Ingen eiendommer er knyttet til kontoen.';for(const p of properties){const row=line($('properties'),p.name,p.address);const reports=await api('/api/reports?property_id='+encodeURIComponent(p.id));if(!reports.length){const x=document.createElement('small');x.textContent='Ingen publiserte rapporter ennå.';row.append(x)}for(const r of reports){const d=document.createElement('p');const a=document.createElement('a');a.href='/kunde/rapport?id='+encodeURIComponent(r.id);a.textContent=(r.report_code||'Rapport')+' – '+r.title+' · Les rapport / lagre PDF';d.append(a);row.append(d)}}}
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});location.replace('/')};load().catch(e=>$('error').textContent=e.message);
</script></body></html>
