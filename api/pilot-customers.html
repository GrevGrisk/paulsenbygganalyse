<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundekartotek | Paulsen Bygganalyse</title><style>:root{font:16px system-ui,Arial,sans-serif;color-scheme:dark;background:#07151d;color:#edf4f7}*{box-sizing:border-box}body{margin:0}header{background:#0c202b;padding:20px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid #31505d}a{color:#b7ddeb}main{max-width:1100px;margin:35px auto;padding:0 20px}h1{margin-bottom:6px}.muted{color:#a9c0cb}input,select,textarea{width:100%;padding:11px;border:1px solid #456170;border-radius:7px;background:#081923;color:white;font:inherit}label{display:block;font-size:13px;color:#c5d6de;margin:12px 0 6px}button{border:0;border-radius:7px;background:#d42f45;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:310px 1fr;gap:22px;margin-top:25px}.panel{background:#102733;border:1px solid #35515e;border-radius:12px;padding:22px}.customer{display:block;width:100%;text-align:left;background:transparent;border:1px solid #304e5c;margin:8px 0;padding:13px;font-weight:400}.customer[aria-pressed=true]{background:#284453;border-color:#c8e4ed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}#message{min-height:22px;color:#f9c0c7}#list{max-height:70vh;overflow:auto}@media(max-width:760px){.layout,.grid{grid-template-columns:1fr}}</style></head><body><header><b>PAULSEN BYGGANALYSE · KUNDEKARTOTEK</b> · <a href="/pilot">← Pilotportal</a></header><main><h1>Kundekartotek</h1><p class="muted">Kun kunde- og fakturainformasjon. Ingen rapporter eller eiendommer vises her.</p><div class="layout"><aside class="panel"><label for="search">Søk kunde</label><input id="search" type="search" placeholder="Navn, kundenummer, org.nr."><p><button type="button" id="new">+ Ny kunde</button></p><div id="list"></div></aside><section class="panel"><h2 id="heading">Velg kunde</h2><form id="form" hidden><div class="grid"><div class="wide"><label for="name">Kundenavn *</label><input id="name" required maxlength="200"></div><div><label for="organization_number">Organisasjonsnummer</label><input id="organization_number" maxlength="30"></div><div><label for="phone">Telefonnummer</label><input id="phone" type="tel" maxlength="50"></div><div><label for="contact_name">Kontaktperson</label><input id="contact_name" maxlength="200"></div><div><label for="contact_email">Kontaktpersonens e-post</label><input id="contact_email" type="email" maxlength="320"></div><div class="wide"><h3>Fakturaopplysninger</h3></div><div class="wide"><label for="billing_address">Fakturaadresse</label><input id="billing_address" maxlength="400"></div><div><label for="billing_postal_code">Postnummer</label><input id="billing_postal_code" maxlength="20"></div><div><label for="billing_city">Poststed</label><input id="billing_city" maxlength="100"></div><div><label for="billing_email">Faktura-e-post</label><input id="billing_email" type="email" maxlength="320"></div><div><label for="reference">Fakturareferanse / merking</label><input id="reference" maxlength="150"></div></div><p><button id="save">Lagre kunde</button></p></form><p id="message" role="status"></p></section></div></main><script>
const $=id=>document.getElementById(id),fields=['name','organization_number','phone','contact_name','contact_email','billing_address','billing_postal_code','billing_city','billing_email','reference'];let customers=[],selected=null,canEdit=false;
async function api(url,opts){const r=await fetch(url,{credentials:'same-origin',...opts});const data=await r.json();if(!r.ok)throw Error(data.error||'Forespørselen feilet');return data}
function showCustomer(c){selected=c?.id||null;$('form').hidden=false;$('heading').textContent=c?(c.customer_code+' · '+c.name):'Ny kunde';for(const k of fields)$(k).value=c?.[k]||'';for(const b of $('list').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.id===selected));$('message').textContent=''}
function render(){const q=$('search').value.trim().toLocaleLowerCase('nb');$('list').replaceChildren();for(const c of customers.filter(x=>(x.name+' '+x.organization_number+' '+x.customer_code+' '+x.contact_name).toLocaleLowerCase('nb').includes(q))){const b=document.createElement('button');b.type='button';b.className='customer';b.dataset.id=c.id;b.setAttribute('aria-pressed',String(c.id===selected));b.textContent=c.customer_code+' · '+c.name;b.onclick=()=>showCustomer(c);$('list').append(b)}}
async function load(){customers=await api('/api/customers');render();if(selected){const c=customers.find(x=>x.id===selected);if(c)showCustomer(c)}}
$('search').oninput=render;$('new').onclick=()=>showCustomer(null);
$('form').onsubmit=async e=>{e.preventDefault();if(!canEdit)return;const payload=Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));const button=$('save');button.disabled=true;try{const result=await api(selected?'/api/customers/'+selected:'/api/customers',{method:selected?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});selected=result.id;await load();$('message').textContent='Kundeopplysninger lagret'}catch(err){$('message').textContent=err.message}finally{button.disabled=false}};
(async()=>{try{const me=await api('/api/me');canEdit=me.role==='admin';if(!canEdit){$('new').hidden=true;$('save').hidden=true;for(const k of fields)$(k).readOnly=true}await load()}catch(err){$('message').textContent=err.message}})();
</script></body></html>
