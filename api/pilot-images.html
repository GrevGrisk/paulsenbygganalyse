<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prosjektbilder – Paulsen Bygganalyse</title><style>body{margin:0;background:#07151d;color:#e8eff3;font:16px Arial,sans-serif}main{max-width:1000px;margin:35px auto;padding:0 20px}a{color:#b3d9e9}input{width:100%;padding:13px;box-sizing:border-box;background:#102733;color:white;border:1px solid #56717e;border-radius:6px;font:inherit}.item{padding:16px;margin:12px 0;background:#102733;border:1px solid #31505d;border-radius:8px}.item a{display:inline-block;margin:8px 15px 0 0}small{color:#b3c4cc}</style></head><body><main><p><a href="/pilot">← Pilotmeny</a></p><h1>Prosjektbilder</h1><p>Søk etter prosjektnummer, rapportnavn eller eiendom.</p><input id="search" placeholder="Søk etter prosjektnummer …" aria-label="Søk etter prosjektnummer"><p id="status">Henter prosjekter …</p><div id="list"></div></main><script>const input=document.getElementById('search'),list=document.getElementById('list'),status=document.getElementById('status');let projects=[];const api=async path=>{const r=await fetch(path,{credentials:'same-origin'});if(!r.ok)throw Error('Kunne ikke hente prosjekter ('+r.status+')');return r.json()};function draw(){list.replaceChildren();const q=input.value.toLowerCase().trim();let matches=projects.filter(p=>p.text.toLowerCase().includes(q));status.textContent=matches.length+' prosjekter';for(const p of matches){const div=document.createElement('div');div.className='item';const title=document.createElement('b');title.textContent=p.text;const links=document.createElement('div');for(const [label,url] of [['Se bilder','/report-images?id='+encodeURIComponent(p.id)],['Rediger rapport','/report-editor?id='+encodeURIComponent(p.id)]]){const a=document.createElement('a');a.href=url;a.textContent=label;links.append(a)}div.append(title,links);list.append(div)}}input.oninput=draw;(async()=>{try{const customers=await api('/api/customers');for(const c of customers){const props=await api('/api/properties?customer_id='+encodeURIComponent(c.id));for(const p of props){const reports=await api('/api/reports?property_id='+encodeURIComponent(p.id));for(const r of reports)projects.push({id:r.id,text:[r.report_code,r.title,p.name,c.name].filter(Boolean).join(' · ')})}}draw()}catch(e){status.textContent=e.message}})();</script></body></html>
