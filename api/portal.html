<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rapportportal – Paulsen Bygganalyse</title>
<style>
:root{font:16px system-ui,Arial,sans-serif;color:#e8eff3;background:#07151d}*{box-sizing:border-box}body{margin:0}
header{background:#0c202b;border-bottom:1px solid #28424f;padding:22px max(20px,calc((100vw - 1100px)/2))}
header strong{letter-spacing:.11em;font-size:14px}main{max-width:1100px;margin:50px auto;padding:0 20px}
.card{max-width:470px;background:#102733;border:1px solid #31505d;padding:30px;border-radius:12px}
h1{font-size:30px;margin:0 0 12px}h2{font-size:21px}p,.muted{color:#a8bec8}
label{display:block;margin:20px 0 8px;font-size:14px}input,select{width:100%;padding:13px;border-radius:6px;border:1px solid #56717e;background:#071923;color:#fff;font:inherit}
button{background:#d22c43;border:0;color:#fff;font:inherit;font-weight:700;border-radius:6px;padding:12px 18px;cursor:pointer}button.secondary{background:#274653}
button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.tile{background:#102733;border:1px solid #31505d;border-radius:10px;padding:20px}
a{color:#b3d9e9}ul{padding-left:22px}li{padding:8px 0}small{color:#a8bec8}.error{color:#ffb1b8}.ok{color:#a3dfc3}
[hidden]{display:none!important}
</style></head>
<body><header><strong>PAULSEN BYGGANALYSE · RAPPORTPORTAL</strong></header>
<main>
<section id="login" class="card" hidden><h1>Logg inn</h1><p>For ansatte og kunder.</p>
<form id="loginForm"><label for="email">E-postadresse</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Passord</label><input id="password" type="password" autocomplete="current-password" required>
<p><button id="loginButton">Logg inn</button></p><p class="error" id="loginError" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="toolbar"><div><h1>Rapportportal</h1><p id="welcome"></p></div><button id="logout" class="secondary">Logg ut</button></div>
<div class="grid"><div class="tile"><h2>Kunder</h2><ul id="customers"></ul></div><div class="tile"><h2>Eiendommer</h2><ul id="properties"></ul></div><div class="tile"><h2>Rapporter</h2><ul id="reports"></ul></div></div>
<div id="staff" class="tile" hidden style="margin-top:18px"><h2>Rapportarbeid</h2><p>Rapporter opprettes og behandles av ansatte. Tilkobling til eksisterende inspeksjonsskjema kommer i neste fase.</p></div>
<p class="error" id="dashboardError" role="alert"></p></section>
<p id="loading">Laster portal …</p>
</main><script>
const el=id=>document.getElementById(id);
const api=async(path,options={})=>{const r=await fetch(path,{credentials:'same-origin',...options});let data;try{data=await r.json()}catch{data={error:'Ugyldig svar'}}if(!r.ok)throw new Error(data.error||'Forespørselen feilet');return data};
const show=(name)=>{for(const n of ['loading','login','dashboard'])el(n).hidden=n!==name};
const li=(parent,label)=>{const node=document.createElement('li');node.textContent=label;el(parent).append(node)};
let current;
async function load(){
 const me=await api('/api/me');current=me;el('welcome').textContent='Innlogget som '+me.full_name+' ('+me.role+')';
 el('staff').hidden=me.role==='customer';show('dashboard');
 try{
  const customers=await api('/api/customers');el('customers').replaceChildren();el('properties').replaceChildren();el('reports').replaceChildren();
  if(!customers.length)li('customers','Ingen kunder registrert');
  for(const c of customers){li('customers',c.name);const properties=await api('/api/properties?customer_id='+encodeURIComponent(c.id));
   for(const p of properties){li('properties',p.name+' – '+p.address);const reports=await api('/api/reports?property_id='+encodeURIComponent(p.id));
    for(const r of reports)li('reports',r.title+' ('+r.status+')');
   }
  }
  if(!el('properties').children.length)li('properties','Ingen eiendommer registrert');
  if(!el('reports').children.length)li('reports','Ingen rapporter tilgjengelig');
 }catch(e){el('dashboardError').textContent=e.message}
}
el('loginForm').addEventListener('submit',async e=>{e.preventDefault();el('loginError').textContent='';el('loginButton').disabled=true;
 try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value,password:el('password').value})});
 el('password').value='';await load()}catch(e){el('loginError').textContent=e.message}finally{el('loginButton').disabled=false}});
el('logout').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}finally{current=null;show('login')}});
load().catch(()=>show('login'));
</script></body></html>
