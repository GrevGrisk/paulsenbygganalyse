<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pristilbud – Paulsen Bygganalyse</title><style>body{font:16px system-ui;background:#091b25;color:white;margin:0}main{max-width:680px;margin:45px auto;padding:25px;background:#142b38;border:1px solid #365260;border-radius:10px}h1{margin-top:0}table{width:100%;border-collapse:collapse}td{padding:12px 4px;border-bottom:1px solid #39525e}td:last-child{text-align:right}button{background:#cf2d46;color:white;border:0;border-radius:5px;padding:13px 19px;font:inherit;font-weight:bold;margin:15px 10px 0 0;cursor:pointer}button.secondary{background:#425d6b}p{line-height:1.5}.muted{color:#b9cbd3}</style><main><h1>Pristilbud</h1><div id="content">Laster tilbud …</div><p id="message" role="status"></p></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(n);
const token=new URLSearchParams(location.search).get('token'),content=document.getElementById('content'),msg=document.getElementById('message');
async function load(){if(!/^[a-f0-9]{48}$/.test(token||'')){content.textContent='Ugyldig lenke';return}try{const r=await fetch('/api/quote/'+token),q=await r.json();if(!r.ok)throw Error(q.error);const sum=q.line_items.reduce((a,x)=>a+Number(x.price),0),net=sum*(1-Number(q.discount_percent)/100),gross=net*1.25;content.innerHTML='<h2>'+esc(q.customer_name)+'</h2><p>'+esc(q.property_address)+'</p><table>'+q.line_items.map(x=>'<tr><td>'+esc(x.description)+'</td><td>'+money(x.price)+'</td></tr>').join('')+'<tr><td>Sum før rabatt eks. mva.</td><td>'+money(sum)+'</td></tr><tr><td>Rabatt ('+esc(q.discount_percent)+' %)</td><td>− '+money(sum-net)+'</td></tr><tr><td>Sum eks. mva.</td><td>'+money(net)+'</td></tr><tr><td>Mva. (25 %)</td><td>'+money(net*.25)+'</td></tr><tr><td><strong>Sum inkl. mva.</strong></td><td><strong>'+money(gross)+'</strong></td></tr></table><h2>Tilbudspris '+(q.price_display==='incl'?'inkl.':'eks.')+' mva.: '+money(q.price_display==='incl'?gross:net)+'</h2><p style="white-space:pre-wrap">'+esc(q.offer_notes)+'</p><p class="muted">Gyldig til: '+esc(q.valid_until?.slice(0,10)||'Ikke angitt')+'</p><p>Status: '+esc(q.status)+'</p>'+(q.status==='sent'?'<p>Ved å akseptere bekrefter du bestilling av tjenestene og prisen som er oppgitt.</p><button data-action="accepted">Aksepter tilbud</button><button class="secondary" data-action="declined">Avslå tilbud</button>':'');content.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>respond(b.dataset.action));}catch(e){content.textContent=e.message}}
async function respond(action){if(!confirm(action==='accepted'?'Vil du akseptere tilbudet og bestille oppdraget?':'Vil du avslå tilbudet?'))return;try{const r=await fetch('/api/quote/'+token+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})}),d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent=action==='accepted'?'Tilbudet er akseptert. Takk for bestillingen.':'Tilbudet er avslått.';await load()}catch(e){msg.textContent=e.message}}
load();
</script></html>
