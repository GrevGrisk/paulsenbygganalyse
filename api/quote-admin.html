<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilbud – administrasjon</title><style>body{font:16px system-ui;background:#091b25;color:white;margin:0}main{max-width:1100px;margin:25px auto;padding:20px}a{color:#8ed7ff}section{background:#142b38;padding:20px;border:1px solid #35505e;border-radius:10px;margin:15px 0}input,select,textarea{box-sizing:border-box;width:100%;background:#071b26;border:1px solid #69838e;color:white;padding:10px;font:inherit;border-radius:5px}label{display:block;margin:12px 0 5px}button{background:#d12c44;color:white;border:0;padding:11px 15px;border-radius:5px;cursor:pointer;margin:10px 8px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.muted{color:#b5cbd3}.line{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin:8px 0}.line button{margin:0}#msg{color:#ffda9e}@media(max-width:600px){.grid,.line{display:block}}</style><main><a href="/">← Portal</a><h1>Tilbudsforespørsler</h1><p class="muted">Priser føres eks. mva. Rabatten beregnes før 25 % mva. Kundens aksept oppretter kunde, eiendom og rapportutkast.</p><div id="list">Laster …</div><p id="msg" role="status"></p></main><script>
const types={'TAK-VIS':'Visuell takinspeksjon','TAK-TMO':'Termografisk takinspeksjon',SOL:'Solcelleinspeksjon',ENG:'Energiscreening',OPPM:'Oppmåling',MOD:'Modellering'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(n);
let quotes=[];
function render(){document.getElementById('list').innerHTML=quotes.map((q,i)=>{const lines=q.line_items?.length?q.line_items:q.services.map(t=>({description:types[t]||t,price:0}));return '<section data-i="'+i+'"><h2>'+esc(q.customer_name)+' – '+esc(q.status)+'</h2><p>'+esc(q.customer_type==='private'?'Privatkunde':'Næringskunde')+' · '+esc(q.email)+' · '+esc(q.phone)+'</p><p>'+esc(q.property_address)+' · '+esc(q.postal_code)+' '+esc(q.municipality)+' · Gnr '+esc(q.gnr)+' / Bnr '+esc(q.bnr)+'</p><p>'+esc(q.building_type)+' · '+esc(q.organization_number)+'</p><p>'+esc(q.property_notes)+'</p><p><strong>Tjenester:</strong> '+q.services.map(t=>esc(types[t]||t)).join(', ')+'</p><div class="lines">'+lines.map(x=>lineHtml(x)).join('')+'</div><button type="button" data-add>+ Prislinje</button><div class="grid"><div><label>Rabatt (%)</label><input type="number" min="0" max="100" step="0.01" data-discount value="'+q.discount_percent+'"></div><div><label>Vis tilbudspris</label><select data-display><option value="excl" '+(q.price_display==='excl'?'selected':'')+'>Eks. mva.</option><option value="incl" '+(q.price_display==='incl'?'selected':'')+'>Inkl. mva.</option></select></div></div><label>Tilbudsbeskrivelse, forbehold og leveranse</label><textarea data-notes rows="4">'+esc(q.offer_notes)+'</textarea><label>Gyldig til</label><input type="date" data-valid value="'+esc(q.valid_until?.slice(0,10)||'')+'"><p data-total></p><button data-save="priced">Lagre utkast</button><button data-save="sent">Marker sendt og lag kundelenke</button>'+(q.status==='sent'||q.status==='accepted'?'<p><a target="_blank" rel="noopener" href="/tilbud/svar?token='+q.public_token+'">Åpne kundens tilbud</a> <button data-copy>Kopier lenke</button></p>':'')+(q.report_id?'<p><a href="/report-editor?id='+q.report_id+'">Åpne opprettet rapport</a></p>':'')+'</section>'}).join('')||'<p>Ingen forespørsler ennå.</p>';document.querySelectorAll('section[data-i]').forEach(el=>{el.addEventListener('input',()=>totals(el));el.querySelector('[data-add]').onclick=()=>{el.querySelector('.lines').insertAdjacentHTML('beforeend',lineHtml({description:'',price:0}));totals(el)};el.addEventListener('click',e=>{if(e.target.matches('[data-remove]')){e.target.closest('.line').remove();totals(el)}});el.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(el,b.dataset.save));const cp=el.querySelector('[data-copy]');if(cp)cp.onclick=()=>navigator.clipboard.writeText(location.origin+'/tilbud/svar?token='+quotes[+el.dataset.i].public_token);totals(el)})}
function lineHtml(x){return '<div class="line"><input aria-label="Tjeneste" data-description maxlength="200" value="'+esc(x.description)+'"><input aria-label="Pris eks mva" data-price type="number" min="0" step="0.01" value="'+Number(x.price||0)+'"><button type="button" data-remove>Fjern</button></div>'}
function totals(el){const sum=[...el.querySelectorAll('[data-price]')].reduce((a,x)=>a+(Number(x.value)||0),0),discount=Number(el.querySelector('[data-discount]').value)||0,net=sum*(1-discount/100);el.querySelector('[data-total]').textContent='Før rabatt: '+money(sum)+' · Rabatt: '+money(sum-net)+' · Eks. mva.: '+money(net)+' · Mva. 25 %: '+money(net*.25)+' · Inkl. mva.: '+money(net*1.25)}
async function save(el,status){const q=quotes[+el.dataset.i],line_items=[...el.querySelectorAll('.line')].map(row=>({description:row.querySelector('[data-description]').value.trim(),price:Number(row.querySelector('[data-price]').value)}));if(!line_items.length||line_items.some(x=>!x.description||!Number.isFinite(x.price)||x.price<0)){alert('Kontroller prislinjene');return}const b={line_items,discount_percent:Number(el.querySelector('[data-discount]').value),price_display:el.querySelector('[data-display]').value,offer_notes:el.querySelector('[data-notes]').value,valid_until:el.querySelector('[data-valid]').value||null,status};if(status==='sent'&&!confirm('Er tilbudet klart til å sendes? Kunden får tilgang via lenken som opprettes.'))return;try{const r=await fetch('/api/quote-requests/'+q.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('msg').textContent=status==='sent'?'Tilbudet er klart. Kopier kundelenken og send den til kunden.':'Utkast lagret.';await load()}catch(e){document.getElementById('msg').textContent=e.message}}
async function load(){try{const r=await fetch('/api/quote-requests');if(!r.ok)throw Error('Kunne ikke hente tilbud');quotes=await r.json();render()}catch(e){document.getElementById('msg').textContent=e.message}}
load();
</script></html>
