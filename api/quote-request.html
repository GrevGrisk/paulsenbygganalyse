<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be om tilbud – Paulsen Bygganalyse</title><style>body{font:16px system-ui;background:#091b25;color:#f0f5f7;margin:0}main{max-width:740px;margin:35px auto;padding:22px}section{background:#142c39;border:1px solid #35505e;border-radius:12px;padding:26px}h1{margin-top:0}label{display:block;margin:15px 0 6px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;background:#081b25;border:1px solid #718b97;border-radius:6px;color:white;font:inherit}input[type=checkbox],input[type=radio]{width:auto}button{background:#d52e47;border:0;border-radius:6px;color:white;font:inherit;font-weight:700;padding:13px 20px;cursor:pointer;margin-top:20px}.inline{display:inline-block;margin-right:22px}.service{display:block;padding:8px 0}.muted{color:#a9c2cc}#message{margin-top:15px}</style><main><section><h1>Be om tilbud</h1><p class="muted">Fyll inn opplysningene nedenfor. Vi vurderer oppdraget og sender deg et pristilbud. Ingen bestilling skjer før du aksepterer tilbudet.</p><form id="form"><strong>Kundetype</strong><div><label class="inline"><input type="radio" name="customer_type" value="private" checked> Privatkunde</label><label class="inline"><input type="radio" name="customer_type" value="business"> Næringskunde</label></div><label id="nameLabel">Navn</label><input name="customer_name" required maxlength="200"><div id="org" hidden><label>Organisasjonsnummer</label><input name="organization_number" maxlength="30"></div><label>E-post</label><input type="email" name="email" required maxlength="254"><label>Telefon</label><input name="phone" maxlength="30"><label>Eiendommens adresse</label><input name="property_address" required maxlength="250"><label>Postnummer</label><input name="postal_code" maxlength="10"><label>Kommune</label><input name="municipality" maxlength="100"><label>Gårdsnummer (gnr.)</label><input name="gnr" maxlength="20"><label>Bruksnummer (bnr.)</label><input name="bnr" maxlength="20"><label>Bygningstype</label><input name="building_type" maxlength="100"><h2>Ønskede tjenester</h2><div id="services"></div><label>Andre opplysninger om eiendommen eller oppdraget</label><textarea name="property_notes" rows="5" maxlength="4000"></textarea><button type="submit">Send tilbudsforespørsel</button><p id="message" role="status"></p></form></section></main><script>
const types=[['TAK-VIS','Visuell takinspeksjon'],['TAK-TMO','Termografisk takinspeksjon'],['SOL','Solcelleinspeksjon'],['ENG','Energiscreening'],['OPPM','Oppmåling'],['MOD','Modellering']];
document.getElementById('services').innerHTML=types.map(([id,name])=>'<label class="service"><input type="checkbox" name="service" value="'+id+'"> '+name+'</label>').join('');
const requestedService=new URLSearchParams(location.search).get('service');if(requestedService&&types.some(([id])=>id===requestedService)){const checkbox=[...document.querySelectorAll('[name=service]')].find(x=>x.value===requestedService);if(checkbox)checkbox.checked=true;}
const requestedContext=new URLSearchParams(location.search).get('context');if(requestedContext){document.querySelector('[name=property_notes]').value=requestedContext.slice(0,4000);}

document.querySelectorAll('[name=customer_type]').forEach(r=>r.addEventListener('change',()=>{let business=document.querySelector('[name=customer_type]:checked').value==='business';document.getElementById('org').hidden=!business;document.getElementById('nameLabel').textContent=business?'Firmanavn':'Navn';}));
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button'),msg=document.getElementById('message');const values=Object.fromEntries(new FormData(form));values.services=[...form.querySelectorAll('[name=service]:checked')].map(x=>x.value);if(!values.services.length){msg.textContent='Velg minst én tjeneste.';return;}button.disabled=true;try{const response=await fetch('/api/quote-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const result=await response.json();if(!response.ok)throw Error(result.error||'Kunne ikke sende');form.hidden=true;msg.textContent='Forespørselen er sendt. Vi kontakter deg på e-post.';}catch(error){msg.textContent=error.message;button.disabled=false;}});
</script></html>
