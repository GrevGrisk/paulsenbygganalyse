<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prosjektbilder – Paulsen Bygganalyse</title><style>body{margin:0;background:#07151d;color:#e8eff3;font:16px system-ui,Arial}main{max-width:1100px;margin:35px auto;padding:0 20px}a{color:#9dd9ee}h1{margin:20px 0}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}figure{margin:0;padding:10px;background:#122b37;border-radius:8px}figure img{width:100%;height:180px;object-fit:contain;cursor:zoom-in}figcaption{overflow-wrap:anywhere;font-size:13px;margin:8px 0}dialog{border:0;background:#0b1720;color:white;max-width:95vw;max-height:95vh}dialog img{max-width:90vw;max-height:80vh;object-fit:contain}button{padding:9px 14px;cursor:pointer}</style></head><body><main><a href="/">← Rapportportal</a><h1 id="title">Prosjektbilder</h1><p id="status">Laster bilder …</p><div id="gallery"></div><dialog id="viewer"><button id="close">Lukk ×</button><p id="caption"></p><img id="large" alt="Stort prosjektbilde"></dialog></main><script>const id=new URLSearchParams(location.search).get('id');const status=document.getElementById('status');const gallery=document.getElementById('gallery');const viewer=document.getElementById('viewer');document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});if(!/^[0-9a-f-]{36}$/i.test(id||'')){status.textContent='Ugyldig prosjekt';}else{fetch('/api/reports/'+encodeURIComponent(id)+'/image-list',{credentials:'same-origin'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Kunne ikke hente bilder');document.getElementById('title').textContent='Prosjektbilder · '+d.report_code;status.textContent=d.images.length+' bilder i prosjektmappen';for(const item of d.images){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption'),link=document.createElement('a');image.src=item.url;image.alt=item.name;image.loading='lazy';image.onclick=()=>{document.getElementById('large').src=item.url;document.getElementById('caption').textContent=item.name;viewer.showModal()};caption.textContent=item.name;link.href=item.url;link.target='_blank';link.rel='noopener';link.textContent='Åpne bilde';figure.append(image,caption,link);gallery.append(figure)}}).catch(e=>{status.textContent=e.message})}</script></body></html>
