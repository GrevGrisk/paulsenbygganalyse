<!doctype html><html lang="nb-NO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilot pre-flight check</title><style>body{font:16px Arial;background:#071219;color:#eaf0f2;max-width:850px;margin:40px auto;padding:20px}a{color:#c5e0ee}p{color:#b7c8d1;line-height:1.6}.card{background:#102530;padding:24px;border-radius:12px;border:1px solid #36515e}label{display:block;padding:13px 0;border-bottom:1px solid #36515e}input[type=checkbox]{width:19px;height:19px;vertical-align:middle;margin-right:12px}button{background:#ef4542;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}#status{font-weight:bold;margin:20px 0}</style></head><body><a href="pilot-prototype.html">← Pilotportal</a><h1>Pilot pre-flight check</h1><p>Foreløpig operativ sjekkliste for droneflyging. Må tilpasses operatørens prosedyrer, drone og gjeldende krav. Erstatter ikke godkjente prosedyrer eller risikovurdering.</p><div class="card"><div id="checks"></div><p id="status"></p><button id="reset">Nullstill sjekklisten</button></div><script>const items=['Oppdrag, flyområde og formål er avklart','Luftrom, restriksjoner og nødvendige tillatelser er kontrollert','Vær, vind og sikt er vurdert','Risiko for personer, bygninger og omgivelser er vurdert','Start- og landingsområde er kontrollert','Drone, propeller og utstyr er visuelt kontrollert','Batterier, kontroller og forbindelser er kontrollert','Hjempunkt, nødprosedyrer og returrute er avklart','Relevant personell er informert og området er sikret'];const key='pba-preflight-v1';let values=[];try{values=JSON.parse(localStorage.getItem(key))||[]}catch{}const box=document.getElementById('checks');function render(){box.innerHTML='';items.forEach((item,i)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=!!values[i];input.onchange=()=>{values[i]=input.checked;localStorage.setItem(key,JSON.stringify(values));status()};label.append(input,document.createTextNode(item));box.append(label)});status()}function status(){const n=items.filter((_,i)=>values[i]).length;document.getElementById('status').textContent=n+' av '+items.length+' punkter bekreftet'+(n===items.length?' – sjekklisten er gjennomgått.':' – ikke ferdig.')}document.getElementById('reset').onclick=()=>{values=[];localStorage.removeItem(key);render()};render()</script></body></html>
