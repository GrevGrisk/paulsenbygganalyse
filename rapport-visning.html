const key='pba-generated-report-v1';let d;try{d=JSON.parse(sessionStorage.getItem(key)||'null')}catch{}const root=document.getElementById('pages');

const page=(n,total,section,title,content)=>'<section class="page">'+head(n,total,title)+'<div class="section">'+esc(section)+'</div><h2>'+esc(title)+'</h2>'+content+foot(n,total)+'</section>';
if(!d){root.innerHTML='<section class="page"><h2>Ingen rapport klar</h2><p>Åpne «Lag rapport», registrer inspeksjonen og velg «Forhåndsvis ferdig rapport».</p><a href="lag-rapport.html">Gå til rapportregistrering →</a></section>';}else{
const f=d.fields||{}, reportTypes=['Visuell takinspeksjon','Takinspeksjon – termografi','Lekkasjesøk – luft / vann','Energiscreening','Solcelleinspeksjon','Oppmåling / 3D','Dronefoto – kun fotodokumentasjon'], selectedTypes=(d.modules||[]).map(i=>reportTypes[i]).filter(Boolean), reportTitle=selectedTypes.length===1?selectedTypes[0]:selectedTypes.length>1?'Kombinert inspeksjonsrapport':'Inspeksjonsrapport', findings=d.findings||[],overview=d.overview||[],date=d.weather?.values?.weatherDate||new Date().toISOString().slice(0,10);
const total=3+findings.length+(overview.length?1:0),chunks=[];
chunks.push('<section class="page cover"><div class="cover-header"><div class="brand"><img src="assets/paulsen-logo-original.png" alt="Paulsen Bygganalyse"><div class="slogan">KLARERE INNSIKT. BEDRE BESLUTNINGER.</div></div><div class="ref">INSPEKSJONSRAPPORT<br>UTKAST · IKKE GODKJENT</div></div><div class="hero">'+(d.cover?img(d.cover,'','Valgt forsidebilde'):'<div class="no-photo">INGEN FORSIDEBILDE VALGT</div>')+'<span class="photo-label">FORSIDEBILDE / INSPEKSJON</span></div><div class="cover-content"><div class="eyebrow">BYGGTEKNISK DOKUMENTASJON</div><h1>'+esc(reportTitle)+'</h1><p class="cover-sub">'+esc(f.address||'Adresse ikke registrert')+'</p><div class="meta"><div><div class="label">EIENDOMSSELSKAP</div><div class="value">'+esc(f.company||'Ikke oppgitt')+'</div></div><div><div class="label">INSPEKSJONSDATO</div><div class="value">'+esc(date)+'</div></div><div><div class="label">INSPEKTØR</div><div class="value">'+esc(f.inspector||'Ikke oppgitt')+'</div></div><div><div class="label">RAPPORTSTATUS</div><div class="value">Utkast – ikke fagkontrollert</div></div></div></div>'+foot(1,total)+'</section>');
chunks.push(page(2,total,'01 / SAMMENDRAG','Oppdrag og sammendrag','<p class="lead">Rapportutkast generert fra registrerte opplysninger. Funn og bilder vises slik de er lagt inn og må fagkontrolleres før levering.</p><div class="block-title">Eiendom og oppdrag</div><div class="details">'+field('Hovedselskap',f.parent)+field('Eiendomsselskap',f.company)+field('Adresse',f.address)+field('Kommune',f.municipality)+field('Gnr. / Bnr.',[f.gnr,f.bnr].filter(Boolean).join(' / '))+field('Inspektør',f.inspector)+field('Inspeksjonshøyde',f.inspectionHeight?f.inspectionHeight+' m':'')+field('Rapporttyper',selectedTypes.join(' · '))+field('Rapportnivå',f.level)+'</div><div class="block-title">Registrerte observasjoner</div><div class="details">'+field('Antall funn',findings.length)+field('Høy prioritet',findings.filter(x=>x.priority==='Høy').length)+field('Oversiktsbilder',overview.length)+field('Vær godkjent',d.weather?.approved?'Ja':'Nei')+'</div><div class="note">Dette er et automatisk generert utkast. Ingen AI-oversettelse, automatisk tilstandsvurdering eller faglig godkjenning er utført.</div>'));
chunks.push(page(3,total,'02 / METODE','Inspeksjonsforhold','<div class="details">'+field('Dato',date)+field('Tidspunkt',d.weather?.values?.weatherTime)+field('Temperatur',d.weather?.values?.weatherTemp?d.weather.values.weatherTemp+' °C':'')+field('Vindstyrke',d.weather?.values?.weatherWind?d.weather.values.weatherWind+' m/s':'')+field('Vindretning',d.weather?.values?.weatherDirection)+field('Værbeskrivelse',d.weather?.values?.weatherCloud)+field('Nedbør siste time',d.weather?.values?.weatherRain?d.weather.values.weatherRain+' mm':'')+field('Værkilde',d.weather?.source)+'</div><div class="block-title">Metode og begrensninger</div><p class="lead">Visuell dokumentasjon fra registrerte bilder. Skjulte konstruksjoner og forhold under overflater kan ikke vurderes uten supplerende kontroll. Beskrivelsene er registrert av brukeren og ikke automatisk kvalitetssikret.</p><div class="note">Værforhold: '+(d.weather?.approved?'Godkjent i registreringen.':'Ikke godkjent. Må kontrolleres før rapporten ferdigstilles.')+'</div>'));
let n=4;if(overview.length){chunks.push(page(n++,total,'03 / BILDER','Oversiktsbilder','<p class="lead">Bilder fra inspeksjonen. Fotografiene er ikke automatisk analysert.</p><div class="photo-grid">'+overview.map((x,i)=>img(x,'','Oversiktsbilde '+(i+1))).join('')+'</div>'));}
findings.forEach((x,i)=>{let media=(x.images||[]).map((src,j)=>img(src,'finding-photo','Funn '+(i+1)+' bilde '+(j+1))).join('');chunks.push(page(n++,total,'04 / REGISTRERTE FUNN','Funn '+String(i+1).padStart(2,'0'),'<div class="finding"><div class="finding-title"><h3>'+esc(x.type||'Observasjon')+'</h3><span class="priority">'+esc(x.priority||'Ikke vurdert')+' prioritet</span></div><div class="details">'+field('Fagmodul',x.category)+field('Plassering',x.location)+'</div>'+media+'<div class="finding-grid"><div><div class="block-title">Observasjon</div><p>'+esc(x.description||'Ingen beskrivelse')+'</p></div><div><div class="block-title">Anbefalt oppfølging</div><p>'+esc(x.action||'Ikke registrert')+'</p></div></div></div>'))});
root.innerHTML=chunks.join('');
}
</script></body></html>
